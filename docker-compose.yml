services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ps5-monitor-backend-v2
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ps5_data:/app/data
      - ./backend/monitor.log:/app/backend/monitor.log
    environment:
      DATABASE_PATH: /app/data/ps5_prices.db
      LOG_FILE: /app/backend/monitor.log
      CORS_ORIGINS: http://localhost:5173
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: ps5-monitor-frontend-v2
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ps5_data:
  frontend_node_modules:
