name: Security audit

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

concurrency:
  group: security-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Auditar dependencias Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar auditor
        run: python -m pip install pip-audit

      - name: Procurar vulnerabilidades conhecidas
        run: python -m pip_audit -r backend/requirements.txt

  frontend:
    name: Auditar dependencias npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Auditar vulnerabilidades altas ou criticas
        run: npm audit --audit-level=high
