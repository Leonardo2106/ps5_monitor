name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PATH: /tmp/ps5_monitor_ci.db
      LOG_FILE: /tmp/ps5_monitor_ci.log
      START_MONITOR_WITH_API: "false"
      RUN_ON_STARTUP: "false"
      TELEGRAM_TOKEN: SEU_TOKEN
      CHAT_ID: SEU_CHAT_ID
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements.txt

      - name: Executar testes
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias reproduziveis
        run: npm ci

      - name: Validar TypeScript e gerar bundle
        run: npm run build

  container:
    name: Container · build da API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ps5-monitor-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
